<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannn Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    background-image:
    radial-gradient(circle at top left,#ff00aa22,transparent 35%),
    radial-gradient(circle at bottom right,#00ffff22,transparent 35%);
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:15px;
}

.video-box{
    width:100%;
    border-radius:15px;
    overflow:hidden;
    background:#1a1a1a;
    margin-bottom:20px;
    box-shadow:0 0 15px rgba(255,255,255,0.1);
}

video{
    width:100%;
    display:block;
}

.credit{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 10px #00ffff;
    margin:30px 0;
}
</style>
</head>

<body>

<div class="container">

    <div class="video-box">
        <video controls>
            <source src="video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="video-box">
        <video controls>
            <source src="video2.mp4" type="video/mp4">
        </video>
    </div>

    <div class="video-box">
        <video controls>
            <source src="video3.mp4" type="video/mp4">
        </video>
    </div>

    <div class="video-box">
        <video controls>
            <source src="video4.mp4" type="video/mp4">
        </video>
    </div>

    <div class="credit">
        Edited by : Pannn.
    </div>

</div>

</body>
</html>
