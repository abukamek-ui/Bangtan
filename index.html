<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Pannn Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: pan-y;
    }

    .slider {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;

      opacity: 0;
      visibility: hidden;

      transition: opacity 0.25s ease;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
    }

    video {
      width: 100%;
      height: auto;

      aspect-ratio: 16 / 9;

      object-fit: contain;

      display: block;
      background: #000;
    }

    /* TITIK */
    .dots {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      gap: 7px;

      z-index: 20;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: rgba(255,255,255,0.4);

      transition: 0.2s;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
    }
  </style>
</head>

<body>

  <div class="slider" id="slider">

    <!-- VIDEO 1 -->
    <section class="slide active">
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="video1.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- VIDEO 2 -->
    <section class="slide">
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="video2.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- VIDEO 3 -->
    <section class="slide">
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="video3.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <!-- VIDEO 4 -->
    <section class="slide">
      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="video4.mp4" type="video/mp4">
        </video>
      </div>
    </section>

  </div>


  <!-- DOT INDICATOR -->
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>


  <script>

    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    let current = 0;

    let startX = 0;
    let startY = 0;

    let isMoving = false;


    function showSlide(index) {

      if (index < 0) {
        index = 0;
      }

      if (index >= slides.length) {
        index = slides.length - 1;
      }

      current = index;


      slides.forEach((slide, i) => {

        slide.classList.toggle(
          "active",
          i === current
        );

        const video =
          slide.querySelector("video");

        if (i !== current) {
          video.pause();
        }

      });


      dots.forEach((dot, i) => {

        dot.classList.toggle(
          "active",
          i === current
        );

      });

    }


    /* =========================
       SWIPE
       ========================= */

    document.addEventListener(
      "touchstart",
      function(e) {

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;

        isMoving = true;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      function(e) {

        if (!isMoving) return;

        isMoving = false;

        const endX =
          e.changedTouches[0].clientX;

        const endY =
          e.changedTouches[0].clientY;


        const diffX =
          endX - startX;

        const diffY =
          endY - startY;


        /*
          Abaikan kalau lebih dominan
          gerakan vertikal
        */

        if (
          Math.abs(diffY) >
          Math.abs(diffX)
        ) {
          return;
        }


        /*
          SWIPE KANAN
          = VIDEO BERIKUTNYA
        */

        if (diffX > 60) {

          showSlide(current + 1);

        }


        /*
          SWIPE KIRI
          = VIDEO SEBELUMNYA
        */

        else if (diffX < -60) {

          showSlide(current - 1);

        }

      },
      { passive: true }
    );


    /* =========================
       KEYBOARD
       ========================= */

    document.addEventListener(
      "keydown",
      function(e) {

        if (e.key === "ArrowRight") {
          showSlide(current + 1);
        }

        if (e.key === "ArrowLeft") {
          showSlide(current - 1);
        }

      }
    );

  </script>

</body>
</html>
