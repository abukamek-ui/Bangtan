<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pannn Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    background:
    radial-gradient(circle at top left,#ff00aa33,transparent 40%),
    radial-gradient(circle at bottom right,#00ffff33,transparent 40%);
}

.slider{
    display:flex;
    width:100vw;
    height:100vh;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100vw;
    height:100vh;
    scroll-snap-align:start;
    position:relative;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
}

.dots{
    position:fixed;
    bottom:65px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:100;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
}

.dot.active{
    background:white;
    box-shadow:0 0 10px cyan;
}

.credit{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 0 10px cyan;
    z-index:100;
}
</style>
</head>

<body>

<div class="slider" id="slider">

<div class="slide">
<video controls playsinline>
<source src="video1.mp4" type="video/mp4">
</video>
</div>

<div class="slide">
<video controls playsinline>
<source src="video2.mp4" type="video/mp4">
</video>
</div>

<div class="slide">
<video controls playsinline>
<source src="video3.mp4" type="video/mp4">
</video>
</div>

<div class="slide">
<video controls playsinline>
<source src="video4.mp4" type="video/mp4">
</video>
</div>

</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<div class="credit">
Edited by : Pannn.
</div>

<script>
const videos = document.querySelectorAll("video");

videos.forEach(video=>{
    video.addEventListener("play",()=>{
        videos.forEach(v=>{
            if(v!==video){
                v.pause();
            }
        });
    });
});

const slider=document.getElementById("slider");
const dots=document.querySelectorAll(".dot");

slider.addEventListener("scroll",()=>{
    const index=Math.round(slider.scrollLeft/window.innerWidth);

    dots.forEach(dot=>dot.classList.remove("active"));

    if(dots[index]){
        dots[index].classList.add("active");
    }
});
</script>

</body>
</html>
